<style>
:root{--bg:#fff;--surface:#f6f6f3;--surface-2:#ecece7;--line:#e2e2dc;--fg:#141414;--muted:#6b6b64;--gold:#ffc907;--gold-ink:#141414;--gold-text:#8a6700;--display:"Montserrat","Noto Emoji","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;line-height:1.5;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:480px;min-height:100svh;display:grid;grid-template-rows:1fr auto 1fr;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0));padding-right:max(16px,env(safe-area-inset-right,0))}
.back{display:inline-flex;align-items:center;gap:6px;margin:22px 0 0;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500}
.back:hover{color:var(--gold-text)}
header{padding-block:max(calc(44px - env(safe-area-inset-top,0px)),0px) 20px;padding-top:calc(max(44px - env(safe-area-inset-top,0px),0px) + 22px);text-align:center;align-self:start}
main{width:100%;min-width:0}
.eyebrow{margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}
h1{margin:0 0 18px;text-align:center;font-size:clamp(24px,7.6vw,44px);font-weight:900;line-height:.95;text-transform:uppercase;}h1 span{background:linear-gradient(transparent 58%,var(--gold) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em}
.restrito{text-align:center;text-wrap:balance;margin:0 0 14px;padding-left:.22em;font-size:10px;font-weight:500;line-height:1.5;letter-spacing:.22em;text-transform:uppercase}.restrito u{text-decoration-thickness:2px;text-underline-offset:2px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.l{display:block;margin:0 0 5px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field{position:relative}
input[type=text],input[type=search],input[type=number]{width:100%;height:46px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 16px var(--display)}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sug{position:absolute;z-index:5;left:0;right:0;top:50px;margin:0;padding:6px;list-style:none;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;max-height:320px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.14)}
.sug button{display:flex;justify-content:space-between;gap:10px;width:100%;min-height:42px;padding:6px 12px;border:0;border-radius:8px;background:none;color:var(--fg);font:500 14px var(--display);text-align:left;cursor:pointer}
.sug button:hover,.sug button[aria-selected=true]{background:var(--surface)}
.sug small{color:var(--muted);font-weight:400;white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 110px;gap:10px;margin-top:12px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 12px var(--display);cursor:pointer}
.chip:hover{border-color:var(--gold);background:var(--surface-2)}
.chip[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.opt{font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.hint{margin:10px 0 0;color:var(--muted);font-size:13px}
.hint b{color:var(--fg);font-weight:500}
#res{margin-top:22px}
.ref{border-color:var(--gold);border-bottom-width:2px}
.ref .t{margin:0;font-size:13px;color:var(--muted)}
.ref .n{margin:2px 0 0;font-size:18px;font-weight:800}
.macros{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 0;font-size:12px;color:var(--muted)}
.macros b{color:var(--fg);font-weight:700}
.macros .key,.macros .key b{color:var(--gold-text)}
.rule{margin:22px 0 10px;font-size:13px;color:var(--muted)}
.rule b{color:var(--gold-text);font-weight:700}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 4px}
.copy{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--gold-text);background:none;color:var(--gold-text);font:700 12px var(--display);cursor:pointer}
.copy:hover{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.alt{margin:8px 0 0;padding:12px 14px}
.ph{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.alt h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 4px;font-size:14px;font-weight:700}
.alt ul{margin:0;padding:0;list-style:none}
.alt li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.alt li:first-child{border-top:0}
.fm::first-letter{text-transform:uppercase}
.fm{text-transform:none;color:var(--fg)}
.fm small{display:block;color:var(--muted);font-size:12px;text-transform:none}
.g{text-align:right;font-size:18px;font-weight:800;color:var(--fg);white-space:nowrap}
.rw{flex-wrap:wrap;cursor:pointer}.rw:hover .fm{color:var(--gold-text)}.det{flex:0 0 100%;margin-top:6px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;cursor:default}.det .dt{margin:0;font-size:12px;color:var(--muted)}.det .macros{margin:4px 0 0}
.g small{font-size:12px;font-weight:500;color:var(--muted)}
.mg{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:14px}.ml{list-style:none;margin:8px 0 0;padding:0}.ml li{padding:4px 0;font-size:15px}.ml b{font-size:18px;font-weight:800}.ml small{color:var(--muted);font-size:12px}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:10px;font-weight:500;text-transform:none;letter-spacing:0;vertical-align:middle}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
footer{align-self:end;margin-top:28px;padding:0 0 16px;text-align:center;color:#9a9a93;font-size:10px;line-height:1.5}
footer p{margin:0 0 3px}
footer a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.alt,.ref{animation:in .25s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>

const catOf=f=>{const x=norm(f.f);if(/^cozid|^pre-cozid/.test(x))return'Cozido';if(/^cru|^crua|fresco, cru/.test(x))return'Cru';if(/^assad/.test(x))return'Assado';if(/^grelhad/.test(x))return'Grelhado';if(/^frit/.test(x))return'Frito';if(/^refogad/.test(x))return'Refogado';return'Outros'};
const ORDER=['Cozido','Cru','Assado','Grelhado','Frito','Refogado','Outros'];
let sel=null,tgt=null,filt='Todos',hi=-1,shown=[],shown2=[],crit=['k'];



function round(g){return g>=100?Math.round(g/5)*5:g>=20?Math.round(g):Math.round(g*2)/2}
function gtxt(g){const r=round(g);return fmt(r,r%1?1:0)}

function macrosHtml(f,g){return `<span>🔥 Calorias <b>${fmt(f.k*g/100)} kcal</b></span><span>🍞 Carboidratos <b>${fmt(f.c*g/100,1)} g</b></span><span>🍗 Proteínas <b>${fmt(f.p*g/100,1)} g</b></span><span>🥑 Gorduras <b>${fmt(f.l*g/100,1)} g</b></span>`}
function toggleRow(li){
  const open=li.getAttribute('aria-expanded')==='true';
  const d=li.querySelector('.det');
  if(open){li.setAttribute('aria-expanded','false');if(d)d.remove();return}
  const f=foods[+li.dataset.fi],g=round(+li.dataset.g);
  const el=document.createElement('div');el.className='det';
  el.innerHTML=`<p class="dt">Em ${gtxt(g)} g de ${f.label}${f.r?' (ref.)':''}</p><div class="macros">${macrosHtml(f,g)}</div>`;
  li.appendChild(el);li.setAttribute('aria-expanded','true')
}
function suggest(){
  const t=norm($('#q').value.trim());
  const ul=$('#sug');
  if(!t||(sel&&norm(sel.label)===t)){ul.hidden=true;$('#q').setAttribute('aria-expanded','false');return}
  const w=t.split(/\s+/);
  shown=foods.filter(f=>w.every(x=>f.s.includes(x))).sort((a,b)=>(a.s.startsWith(w[0])?0:1)-(b.s.startsWith(w[0])?0:1)).slice(0,12);
  hi=-1;
  ul.innerHTML=shown.length?shown.map((f,i)=>`<li role="presentation"><button type="button" role="option" data-i="${i}">${f.label}<small>${DATA.groups[f.g].nome.split(',')[0]}</small></button></li>`).join(''):'<li class="empty" style="padding:14px">Nenhum alimento encontrado. Tente outro nome.</li>';
  ul.hidden=false;$('#q').setAttribute('aria-expanded','true');
}
function pick(f){sel=f;if(tgt&&tgt.g!==f.g){tgt=null;$('#q2').value=''}filt='Todos';$('#q').value=f.label;$('#sug').hidden=true;$('#q').setAttribute('aria-expanded','false');render()}
function suggest2(){
  const ul=$('#sug2'),t=norm($('#q2').value.trim());
  if(!t||(tgt&&norm(tgt.label)===t)){ul.hidden=true;$('#q2').setAttribute('aria-expanded','false');return}
  if(!sel){ul.innerHTML='<li class="empty" style="padding:14px">Escolha primeiro o alimento da sua dieta (passo 1).</li>';ul.hidden=false;return}
  const w=t.split(/\s+/);
  shown2=foods.filter(f=>f.g===sel.g&&f.i!==sel.i&&w.every(x=>f.s.includes(x))).slice(0,8);
  ul.innerHTML=shown2.length?shown2.map((f,i)=>`<li role="presentation"><button type="button" role="option" data-i="${i}">${f.label}</button></li>`).join(''):'<li class="empty" style="padding:14px">Nenhuma troca com esse nome no mesmo grupo.</li>';
  ul.hidden=false;$('#q2').setAttribute('aria-expanded','true')
}
function pick2(f){tgt=f;$('#q2').value=f.label;$('#sug2').hidden=true;$('#q2').setAttribute('aria-expanded','false');render()}

function render(){
  const R=$('#res');
  if(!sel){R.innerHTML='';return}
  const grams=parseFloat(String($('#gr').value).replace(',','.'));
  if(!(grams>0)){R.innerHTML='<div class="card empty">Digite a quantidade em gramas.</div>';return}
  const grp=DATA.groups[sel.g],keys=['k'],key='k',multi=keys.length>1;
  const bases={};keys.forEach(k=>bases[k]=sel[k]*grams/100);const base=bases[key];
  const lack=keys.filter(k=>!(bases[k]>0));
  const rt=keys.map(k=>`<b>${NUT[k]}</b> (${fmt(bases[k],k==='k'?0:1)} ${k==='k'?'kcal':'g'})`).join(' e ')+'. Ao clicar no alimento escolhido, você <b>verá todos os macronutrientes</b>';
  const gcell=x=>multi?'<span class="g mg">'+keys.map((k,i)=>'<span>'+NUTE[k]+' '+gtxt(x.gs[i])+'<small> g</small></span>').join('')+'</span>':'<span class="g">'+gtxt(x.g)+'<small> g</small></span>';
  const sm=x=>multi?'':`<small>🔥 ${fmt(x.f.k*x.g/100)} kcal${key==='k'?'':' · '+NUTE[key]+' '+NUTL[key]+' '+fmt(x.f[key]*x.g/100,1)+' g'}</small>`;
  const head=`<div class="card ref"><p class="t">Você escolheu</p><p class="n">${gtxt(grams)} g de ${sel.label}${sel.r?'<span class="tag">ref.</span>':''}</p>
  <div class="macros"><span>🔥 Calorias <b>${fmt(sel.k*grams/100)} kcal</b></span><span class="${keys.includes('c')?'key':''}">🍞 Carboidratos <b>${fmt(sel.c*grams/100,1)} g</b></span><span class="${keys.includes('p')?'key':''}">🍗 Proteínas <b>${fmt(sel.p*grams/100,1)} g</b></span><span class="${keys.includes('l')?'key':''}">🥑 Gorduras <b>${fmt(sel.l*grams/100,1)} g</b></span></div></div>`;
  if(lack.length){R.innerHTML=head+'<div class="card empty" style="margin-top:12px">Este alimento não tem '+lack.map(k=>NUT[k]).join(' nem ')+' para igualar. Escolha outra opção no passo 4.</div>';return}
  const alts=foods.filter(f=>f.g===sel.g&&f.i!==sel.i&&keys.every(k=>f[k]>0)).map(f=>({f,gs:keys.map(k=>bases[k]/f[k]*100),g:base/f[key]*100})).filter(x=>x.gs.every(v=>v<=2000));
  if(tgt&&tgt.g===sel.g){
    if(!keys.every(k=>tgt[k]>0)){R.innerHTML=head+'<div class="card empty" style="margin-top:12px">'+tgt.label+' não tem '+keys.filter(k=>!(tgt[k]>0)).map(k=>NUT[k]).join(' nem ')+' para igualar. Escolha outra opção no passo 4.</div>';return}
    const gt=base/tgt[key]*100,gts=keys.map(k=>bases[k]/tgt[k]*100);
    const mk=(f,g)=>`<div class="macros"><span>🔥 Calorias <b>${fmt(f.k*g/100)} kcal</b></span><span class="${keys.includes('c')?'key':''}">🍞 Carboidratos <b>${fmt(f.c*g/100,1)} g</b></span><span class="${keys.includes('p')?'key':''}">🍗 Proteínas <b>${fmt(f.p*g/100,1)} g</b></span><span class="${keys.includes('l')?'key':''}">🥑 Gorduras <b>${fmt(f.l*g/100,1)} g</b></span></div>`;
    const oth=foods.filter(f=>f.b===tgt.b&&f.i!==tgt.i&&f.i!==sel.i&&keys.every(k=>f[k]>0)).map(f=>({f,gs:keys.map(k=>bases[k]/f[k]*100),g:base/f[key]*100}));
    const othHtml=oth.length?`<div class="card alt"><h3><span>${tgt.b} em outro preparo</span><span class="ph">peso</span></h3><ul>${oth.map(x=>`<li class="rw" data-fi="${x.f.i}" data-g="${x.g}" role="button" tabindex="0" aria-expanded="false"><span class="fm">${x.f.f||'pronto'}${sm(x)}</span>${gcell(x)}</li>`).join('')}</ul></div>`:'';
    R.innerHTML=head+`<p class="rule">Troca igualando ${rt}.</p><div class="card ref"><p class="t">Você pode comer</p>${multi?'<p class="n">'+tgt.label+(tgt.r?'<span class="tag">ref.</span>':'')+'</p><ul class="ml">'+keys.map((k,i)=>'<li>'+NUTE[k]+' <b>'+gtxt(gts[i])+' g</b> <small>igualando '+NUT[k]+'</small></li>').join('')+'</ul>':'<p class="n">'+gtxt(gt)+' g de '+tgt.label+(tgt.r?'<span class="tag">ref.</span>':'')+'</p>'+mk(tgt,gt)}</div>`+othHtml+`<button type="button" class="copy" id="all" style="margin-top:14px">Ver todas as trocas</button>`;
    return}
  const cats=ORDER.filter(c=>alts.some(x=>catOf(x.f)===c));
  const bar=cats.length>1?`<div class="chips" role="group" aria-label="Filtrar por preparo">${['Todos',...cats].map(c=>`<button type="button" class="chip" data-c="${c}" aria-pressed="${c===filt}">${c}</button>`).join('')}</div>`:'';
  const list=alts.filter(x=>filt==='Todos'||catOf(x.f)===filt);
  const byBase=new Map();
  list.forEach(x=>{if(!byBase.has(x.f.b))byBase.set(x.f.b,[]);byBase.get(x.f.b).push(x)});
  const same=[...byBase.keys()].sort((a,b)=>(b===sel.b)-(a===sel.b));
  const cards=same.map(b=>{
    const rows=byBase.get(b).sort((a,c)=>ORDER.indexOf(catOf(a.f))-ORDER.indexOf(catOf(c.f)));
    return `<div class="card alt"><h3><span>${b}${b===sel.b?'<span class="tag">mesmo alimento</span>':''}${rows[0].f.r?'<span class="tag">ref.</span>':''}</span><span class="ph">peso</span></h3><ul>${rows.map(x=>`<li class="rw" data-fi="${x.f.i}" data-g="${x.g}" role="button" tabindex="0" aria-expanded="false"><span class="fm">${x.f.f||'pronto'}${sm(x)}</span>${gcell(x)}</li>`).join('')}</ul></div>`}).join('');
  R.innerHTML=head+`<p class="rule">Trocas dentro de <b>${grp.nome}</b>, igualando ${rt}.</p>
  <div class="tools"><span class="sr">Resultados</span>${bar?'':'<span></span>'}<button type="button" class="copy" id="copy">Copiar lista</button></div>${bar}${cards||'<div class="card empty">Nenhuma troca neste filtro.</div>'}`;
  window._txt=()=>`Trocas para ${gtxt(grams)} g de ${sel.label} (${keys.map(k=>NUT[k]).join(' e ')}):\n`+list.map(x=>`• ${x.f.b}${x.f.f?' '+x.f.f:''}: ${multi?keys.map((k,i)=>gtxt(x.gs[i])+' g ('+NUT[k]+')').join(' · '):gtxt(x.g)+' g'}`).join('\n')+'\n\nnutrivitorporto.com/lista-de-substituicoes';
}

$('#q').addEventListener('input',()=>{sel=null;$('#res').innerHTML='';suggest()});
$('#q2').addEventListener('input',()=>{tgt=null;suggest2();render()});
$('#q2').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(shown2[0]&&!$('#sug2').hidden)pick2(shown2[0])}else if(e.key==='Escape')$('#sug2').hidden=true});
$('#sug2').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick2(shown2[+b.dataset.i])});
$('#q').addEventListener('focus',()=>{if($('#q').value)$('#q').select()});
$('#q').addEventListener('keydown',e=>{
  const b=[...document.querySelectorAll('#sug button')];
  if(e.key==='ArrowDown'&&b.length){e.preventDefault();hi=(hi+1)%b.length}
  else if(e.key==='ArrowUp'&&b.length){e.preventDefault();hi=(hi-1+b.length)%b.length}
  else if(e.key==='Enter'){e.preventDefault();pick(shown[hi>=0?hi:0]||sel);return}
  else if(e.key==='Escape'){$('#sug').hidden=true;return}
  else return;
  b.forEach((x,i)=>x.setAttribute('aria-selected',i===hi))
});
$('#sug').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(shown[+b.dataset.i])});
document.addEventListener('click',e=>{if(!e.target.closest('.field')){$('#sug').hidden=true;$('#sug2').hidden=true}});
$('#gr').addEventListener('input',()=>{render();if(sel)history.replaceState(null,'','#'+sel.i+'-'+($('#gr').value||100))});
$('#res').addEventListener('click',async e=>{
  const rw=e.target.closest('.rw');if(rw&&!e.target.closest('.det')){toggleRow(rw);return}
  const c=e.target.closest('.chip');if(c){filt=c.dataset.c;render();return}
  if(e.target.id==='all'){tgt=null;$('#q2').value='';render();return}
  if(e.target.id==='copy'){const t=window._txt();try{if(navigator.share){await navigator.share({text:t})}else{await navigator.clipboard.writeText(t);e.target.textContent='Copiado ✓'}}catch(_){try{await navigator.clipboard.writeText(t);e.target.textContent='Copiado ✓'}catch(__){}}}
});
const h=location.hash.match(/^#(\d+)-(\d+(?:\.\d+)?)$/);
if(h&&foods[+h[1]]){$('#gr').value=h[2];pick(foods[+h[1]])}
</script>
