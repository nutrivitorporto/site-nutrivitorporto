<style>
:root{--bg:#fff;--fg:#141414;--muted:#8a8a84;--line:#ececE6;--gold:#ffc907;--ok:#2e9e5b;--warn:#f0b400;--bad:#d64545;--display:"Montserrat","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.45}
.wrap{max-width:420px;min-height:100svh;display:flex;flex-direction:column;margin:0 auto;padding:0 max(22px,env(safe-area-inset-left,0)) calc(var(--bar,150px) + 18px) max(22px,env(safe-area-inset-right,0))}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0}
header{padding:calc(max(env(safe-area-inset-top,0px),44px) + 22px) 0 0;text-align:center}
.restrito{margin:0 0 50px;padding-left:.22em;font-size:10px;font-weight:500;line-height:1.5;letter-spacing:.22em;text-transform:uppercase;text-wrap:balance}.restrito u{text-decoration-thickness:2px;text-underline-offset:2px}
@media (max-height:700px){.restrito{margin-bottom:22px!important}.logo img{width:min(44vw,165px)!important}main{justify-content:flex-start!important;padding-top:14px!important}}.logo{margin:0;line-height:0}.logo img{display:block;margin:0 auto;width:min(54vw,210px);height:auto}
h1:not(.logo){margin:0;font-size:clamp(22px,6.4vw,30px);font-weight:900;line-height:1;text-transform:uppercase;letter-spacing:.01em}
h1 span{background:linear-gradient(transparent 62%,var(--gold) 62%);padding:0 .08em}
.lead{margin:14px auto 0;max-width:36ch;color:var(--muted);font-size:13px;line-height:1.5;text-wrap:balance}
section{margin-top:30px}
.sd{margin:-6px 0 12px 32px;color:var(--muted);font-size:12px}
h2{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;gap:10px;align-items:center}
h2 i{font-style:normal;display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--fg);color:#fff;font-size:11px;align-items:center;justify-content:center;flex:none}
.seg{display:inline-flex;padding:3px;border-radius:99px;background:#f3f3ef;margin-bottom:14px}
.seg button{min-height:34px;padding:0 14px;border:0;border-radius:99px;background:none;color:var(--muted);font:700 12px var(--display);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold);color:#141414;box-shadow:0 0 14px rgba(255,201,7,.75),0 0 3px rgba(255,201,7,.9)}
input{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--fg);font:500 16px var(--display)}
input::placeholder{color:#b4b4ae}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input:focus{border-color:var(--gold);box-shadow:0 0 12px rgba(255,201,7,.55)}
.field{position:relative}
.sug{position:absolute;z-index:8;left:0;right:0;top:54px;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:14px;max-height:290px;overflow:auto;box-shadow:0 14px 34px rgba(0,0,0,.14)}
.sug button{text-align:left;display:flex;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:6px 12px;border:0;border-radius:9px;background:none;color:var(--fg);font:500 14px var(--display);text-align:left;cursor:pointer}
.sug button:hover,.sug button[aria-selected=true]{background:#f6f6f3}
.sug small{color:var(--muted);font-weight:400;white-space:nowrap}
.qrow{display:grid;grid-template-columns:84px 1fr;gap:10px;margin-top:10px;align-items:center;text-align:left}
.qrow select{width:100%;height:48px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--fg);font:600 14px var(--display)}
.qrow span{color:var(--muted);font-size:13px;line-height:1.3}
.btn{grid-column:1/-1;display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--gold);color:#141414;font:800 14px var(--display);cursor:pointer}
.list{margin:0 0 12px;padding:0;list-style:none}
.list:empty{margin:0}
.it{display:grid;grid-template-columns:1fr auto 30px;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.it b{font-weight:700;font-size:14px;line-height:1.3}
.it small{display:block;color:var(--muted);font-size:12px}
.it .k{font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rm{width:30px;height:30px;border:0;border-radius:8px;background:none;color:#b4b4ae;font-size:20px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--fg);font:600 12px var(--display);cursor:pointer}
.chip small{font-weight:500;color:var(--muted)}
.chip:hover{border-color:var(--gold)}
.lab2{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.more{margin-top:10px;background:none;border:0;color:var(--muted);font:700 12px var(--display);text-decoration:underline;cursor:pointer;padding:6px 0}
.foot{margin-top:24px;text-align:center;color:var(--muted);font-size:11px;text-wrap:balance}
.foot button{background:none;border:0;color:inherit;font:600 11px var(--display);text-decoration:underline;cursor:pointer;margin-bottom:10px}
.foot a{color:inherit}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.res{max-width:420px;margin:0 auto;padding:12px max(22px,env(safe-area-inset-left,0)) 8px max(22px,env(safe-area-inset-right,0))}
.res .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.res .lab{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.res .of{display:block;font-size:12px;color:var(--muted)}
.res .num{font-size:30px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .num small{font-size:13px;font-weight:700}
.bar{height:8px;border-radius:99px;background:#f0f0ec;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--ok);transition:width .25s}
.st-ok .num{color:var(--ok)}.st-warn .num{color:#a97b00}.st-bad .num{color:var(--bad)}
.st-warn .bar i{background:var(--warn)}.st-bad .bar i{background:var(--bad)}
nav{max-width:420px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;padding:2px max(10px,env(safe-area-inset-left,0)) calc(4px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0))}
nav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:700;border-radius:12px}
nav a svg{width:22px;height:22px}
nav a[aria-current=page]{color:var(--fg)}
nav a[aria-current=page] svg{background:var(--gold);border-radius:99px;padding:3px;width:34px;height:26px;box-shadow:0 0 14px rgba(255,201,7,.8),0 0 3px rgba(255,201,7,.9)}
nav a[aria-current=page]{text-shadow:0 0 10px rgba(255,201,7,.6)}
[hidden]{display:none!important}

const CAT=[].concat(
  FREE.map((f,i)=>({id:"f"+i,n:f[1],u:f[2],g:f[3],k:f[4],t:"un",grp:f[0],q:norm(f[1]+" "+(f[5]||""))})),
  TACO.map((f,i)=>{return {id:"t"+i,n:f[0]+(f[1]?" ("+f[1]+")":""),u:"gramas",g:100,k:f[2],t:"g",grp:"",q:norm(f[0]+" "+f[1]),m:[]}})
);
const byId={};CAT.forEach(c=>byId[c.id]=c);
const kcalOf=(it)=>it.cid?(byId[it.cid].t==="g"?byId[it.cid].k*it.q*(it.m||1)/100:byId[it.cid].k*it.q):it.k;
const total=l=>l.reduce((a,b)=>a+kcalOf(b),0);
const budget=()=>S.mode==="kcal"?(+S.kcal||0):total(S.plan);

function search(q){
  const t=norm(q).trim().split(/\s+/).filter(Boolean); if(!t.length) return [];
  return CAT.filter(c=>t.every(w=>c.q.includes(w))).sort((a,b)=>(b.q.startsWith(t[0])-a.q.startsWith(t[0]))||(a.t===b.t?0:a.t==="un"?-1:1)).slice(0,8);
}
// campo "adicionar" (um por vez): busca; depois de escolher, quantidade e botão
function adder(root,list,opts){
  let sel=null,custom=false,hi=-1,res=[];
  const id=opts.id;
  root.innerHTML='<div class="field"><input id="'+id+'q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+opts.ph+'" aria-label="'+opts.label+'" role="combobox" aria-expanded="false" aria-controls="'+id+'s"><ul class="sug" id="'+id+'s" role="listbox" hidden></ul></div>'+
  '<div class="qrow" id="'+id+'a" hidden><input id="'+id+'n" type="number" inputmode="decimal" min="0" step="any" value="1" aria-label="Quantidade"><span id="'+id+'u"></span><button class="btn" id="'+id+'b" type="button">Adicionar</button></div>';
  const q=$("#"+id+"q"),sg=$("#"+id+"s"),ad=$("#"+id+"a"),nn=$("#"+id+"n"),un=$("#"+id+"u"),bt=$("#"+id+"b");
  const close=()=>{sg.hidden=true;q.setAttribute("aria-expanded","false");hi=-1};
  let mu=0,ml="";
  const gm=()=>mu||1;
  const prev=()=>{
    const v=parseFloat(nn.value.replace(",","."));
    if(!(v>0)){bt.disabled=true;bt.style.opacity=.35;bt.textContent="Adicionar";return}
    bt.disabled=false;bt.style.opacity=1;
    bt.textContent=custom?"Adicionar":"Adicionar · "+fmt(sel.t==="g"?sel.k*v*gm()/100:sel.k*v)+" kcal";
  };
  const setUnit=()=>{const o=$("#"+id+"m");const i=o?+o.value:-1;
    if(i>=0&&sel.m[i]){mu=sel.m[i][1];ml=sel.m[i][0];nn.value=1;nn.step="0.5"}else{mu=0;ml="";nn.value=100;nn.step="any"}
    prev()};
  const pick=c=>{sel=c;custom=false;mu=0;ml="";q.value=c.n;close();ad.hidden=false;nn.value=c.t==="g"?100:1;nn.step=c.t==="g"?"any":"0.5";
    if(c.t==="g"&&c.m.length){un.innerHTML='<select id="'+id+'m" aria-label="Medida"><option value="-1">gramas</option>'+c.m.map((x,i)=>'<option value="'+i+'">'+esc(x[0])+" ("+x[1]+" g)</option>").join("")+"</select>";$("#"+id+"m").onchange=setUnit}
    else un.textContent=c.t==="g"?"gramas":c.u;
    prev();nn.focus();nn.select()};
  const goCustom=()=>{sel=null;custom=true;close();ad.hidden=false;nn.value="";nn.step="1";un.textContent="calorias no total";prev();nn.focus()};
  q.onfocus=()=>{setTimeout(()=>{try{q.scrollIntoView({block:"center",behavior:"smooth"})}catch(e){}},250)};
  q.oninput=()=>{sel=null;custom=false;ad.hidden=true;res=search(q.value);hi=-1;
    if(!q.value.trim()){close();return}
    let h=res.map((c,i)=>'<li><button type="button" role="option" data-i="'+i+'">'+esc(c.n)+'<small>'+(c.t==="g"?"100 g · "+fmt(c.k)+" kcal":fmt(c.k)+" kcal")+'</small></button></li>').join("");
    h+='<li><button type="button" data-c="1">'+(res.length?"Outro? ":"Não achei. ")+"Digitar as calorias<small>✎</small></button></li>";
    sg.innerHTML=h;sg.hidden=false;q.setAttribute("aria-expanded","true")};
  sg.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.c)goCustom();else pick(res[+b.dataset.i])};
  q.onkeydown=e=>{const bs=[...sg.querySelectorAll("button")];if(sg.hidden||!bs.length){return}
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();hi=(hi+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.setAttribute("aria-selected",i===hi));}
    else if(e.key==="Enter"){e.preventDefault();(bs[hi>=0?hi:0]).click()}else if(e.key==="Escape")close()};
  document.addEventListener("click",e=>{if(!root.contains(e.target))close()});
  nn.oninput=prev;
  nn.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();bt.click()}};
  bt.onclick=()=>{const v=parseFloat(nn.value.replace(",","."));if(!(v>0))return;
    if(custom){list.push({n:q.value.trim()||"Item sem nome",k:Math.round(v),lab:"calorias informadas"})}
    else if(sel){const o={cid:sel.id,q:v};if(sel.t==="g"&&mu){o.m=mu;o.ml=ml}list.push(o)}
    save();q.value="";sel=null;custom=false;ad.hidden=true;render();q.focus()};
}
function rows(list,ul,empty){
  ul.innerHTML=list.map((it,i)=>{
    const c=it.cid&&byId[it.cid],nome=c?c.n:it.n,k=kcalOf(it);
    const det=c?(c.t==="g"?(it.m?String(it.q).replace(".",",")+" × "+it.ml+" ("+it.m+" g)":it.q+" g"):(it.q===1?"1 × ":String(it.q).replace(".",",")+" × ")+c.u):it.lab;
    return '<li class="it"><div><b>'+esc(nome)+'</b><small>'+esc(det)+'</small></div><span class="k">'+fmt(k)+' kcal</span><button class="rm" type="button" data-i="'+i+'" aria-label="Remover '+esc(nome)+'">×</button></li>';
  }).join("");
  ul.onclick=e=>{const b=e.target.closest(".rm");if(!b)return;list.splice(+b.dataset.i,1);save();render()};
}
const POP=[/^pizza de mussarela/,/^pizza de calabresa/,/^hamb[uú]rguer simples/,/^batata frita/,/^refrigerante comum/,/^sorvete de massa/,/^brigadeiro/,/^cerveja$/,/^coxinha/,/^milk-shake/,/^p[aã]o de queijo/,/^chocolate ao leite/,/big mac/,/whopper$/,/^bolo/,/^pudim/];
const popIdx=c=>{const n=c.n.toLowerCase();const i=POP.findIndex(r=>r.test(n));return i<0?99:i};
function render(){
  $("#m-food").setAttribute("aria-pressed",S.mode==="food");$("#m-kcal").setAttribute("aria-pressed",S.mode==="kcal");
  $("#plan-food").hidden=S.mode!=="food";$("#plan-kcal").hidden=S.mode!=="kcal";
  rows(S.plan,$("#plan-list"));rows(S.free,$("#free-list"));
  const B=budget(),U=total(S.free),R=B-U,res=$("#res"),pct=B>0?U/B:0;
  res.className="res "+(B>0?(pct>1?"st-bad":pct>=.85?"st-warn":"st-ok"):"");
  if(B<=0){$("#r-lab").textContent="Seu limite";$("#r-of").textContent="Informe no passo 1";$("#r-num").textContent="—";$("#r-bar").style.width="0"}
  else{
    $("#r-lab").textContent=R<0?"Acima do limite":"Ainda pode comer";
    $("#r-of").textContent="de "+fmt(B)+" kcal";
    $("#r-num").innerHTML=(R<0?"−":"")+fmt(Math.abs(R))+" <small>kcal</small>";
    $("#r-bar").style.width=Math.min(100,pct*100)+"%";
  }
  const fit=$("#fit");
  if(B>0&&R>0){
    const L=CAT.filter(c=>c.t==="un"&&c.k<=R&&c.k>20).sort((a,b)=>(popIdx(a)-popIdx(b))||(b.k-a.k));
    fit.hidden=!L.length;
    const show=window.__more?L:L.slice(0,3);
    $("#fit-chips").innerHTML=show.map(c=>'<button class="chip" type="button" data-id="'+c.id+'">'+esc(c.n)+' <small>'+fmt(c.k)+'</small></button>').join("");
    const mb=$("#fit-more");mb.hidden=L.length<=3;mb.textContent=window.__more?"Ver menos":"Ver mais ("+(L.length-3)+")";
  } else fit.hidden=true;
  document.documentElement.style.setProperty("--bar",$("#dock").offsetHeight+"px");
}
$("#m-food").onclick=()=>{S.mode="food";save();render()};
$("#m-kcal").onclick=()=>{S.mode="kcal";save();render();$("#kcal").focus()};
$("#kcal").value=S.kcal;
$("#kcal").oninput=e=>{S.kcal=e.target.value;save();render()};
$("#fit-chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;S.free.push({cid:b.dataset.id,q:1});save();render()};
$("#fit-more").onclick=()=>{window.__more=!window.__more;render()};
$("#reset").onclick=()=>{if(S.plan.length||S.free.length||S.kcal){if(!confirm("Limpar tudo e começar de novo?"))return}window.__more=false;S.mode="food";S.plan.length=0;S.free.length=0;S.kcal="";$("#kcal").value="";save();render()};
adder($("#plan-add"),S.plan,{id:"p",label:"Adicionar alimento do plano",ph:"Ex.: arroz, frango…"});
adder($("#free-add"),S.free,{id:"f",label:"Adicionar alimento",ph:"Ex.: pizza, sorvete…"});
window.addEventListener("resize",render);
render();
</script>
</body>
</html>
