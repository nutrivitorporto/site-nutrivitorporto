const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const NUT={c:'carboidratos',p:'proteínas',l:'gorduras',k:'calorias'};
const NUTL={c:'Carboidratos',p:'Proteínas',l:'Gorduras',k:'Calorias'};
const foods=DATA.foods.map((f,i)=>({...f,i,label:f.f?f.b+' · '+f.f:f.b,s:norm(f.b+' '+f.f)}));
const fmt=(n,d=0)=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const catOf=f=>{const x=norm(f.f);if(/^cozid|^pre-cozid/.test(x))return'Cozido';if(/^cru|^crua|fresco, cru/.test(x))return'Cru';if(/^assad/.test(x))return'Assado';if(/^grelhad/.test(x))return'Grelhado';if(/^frit/.test(x))return'Frito';if(/^refogad/.test(x))return'Refogado';return'Outros'};
const ORDER=['Cozido','Cru','Assado','Grelhado','Frito','Refogado','Outros'];
let sel=null,tgt=null,filt='Todos',hi=-1,shown=[],shown2=[];

function round(g){return g>=100?Math.round(g/5)*5:g>=20?Math.round(g):Math.round(g*2)/2}
function gtxt(g){const r=round(g);return fmt(r,r%1?1:0)}

function suggest(){
  const t=norm($('#q').value.trim());
  const ul=$('#sug');
  if(!t||(sel&&norm(sel.label)===t)){ul.hidden=true;$('#q').setAttribute('aria-expanded','false');return}
  const w=t.split(/\s+/);
  shown=foods.filter(f=>w.every(x=>f.s.includes(x))).sort((a,b)=>(a.s.startsWith(w[0])?0:1)-(b.s.startsWith(w[0])?0:1)).slice(0,8);
  hi=-1;
  ul.innerHTML=shown.length?shown.map((f,i)=>`<li role="presentation"><button type="button" role="option" data-i="${i}">${f.label}<small>${DATA.groups[f.g].nome.split(',')[0]}</small></button></li>`).join(''):'<li class="empty" style="padding:14px">Nenhum alimento encontrado. Tente outro nome.</li>';
  ul.hidden=false;$('#q').setAttribute('aria-expanded','true');
}
function pick(f){sel=f;if(tgt&&tgt.g!==f.g){tgt=null;$('#q2').value=''}filt='Todos';$('#q').value=f.label;$('#sug').hidden=true;$('#q').setAttribute('aria-expanded','false');render()}
function suggest2(){
  const ul=$('#sug2'),t=norm($('#q2').value.trim());

  shown2=foods.filter(f=>f.g===sel.g&&f.i!==sel.i&&w.every(x=>f.s.includes(x))).slice(0,8);
  ul.innerHTML=shown2.length?shown2.map((f,i)=>`<li role="presentation"><button type="button" role="option" data-i="${i}">${f.label}</button></li>`).join(''):'<li class="empty" style="padding:14px">Nenhuma troca com esse nome no mesmo grupo.</li>';

}

  if(!(base>0)){R.innerHTML=head+'<div class="card empty" style="margin-top:12px">Este alimento não tem o nutriente de referência do grupo.</div>';return}

    const mk=(f,g)=>`<div class="macros"><span>Calorias <b>${fmt(f.k*g/100)} kcal</b></span><span class="${key==='c'?'key':''}">Carboidratos <b>${fmt(f.c*g/100,1)} g</b></span><span class="${key==='p'?'key':''}">Proteínas <b>${fmt(f.p*g/100,1)} g</b></span><span class="${key==='l'?'key':''}">Gorduras <b>${fmt(f.l*g/100,1)} g</b></span></div>`;
    const oth=foods.filter(f=>f.b===tgt.b&&f.i!==tgt.i&&f.i!==sel.i&&f[key]>0).map(f=>({f,g:base/f[key]*100}));
    const othHtml=oth.length?`<div class="card alt"><h3>${tgt.b} em outro preparo</h3><ul>${oth.map(x=>`<li><span class="fm">${x.f.f||'pronto'}<small>${fmt(x.f.k*x.g/100)} kcal · ${NUTL[key]} ${fmt(x.f[key]*x.g/100,1)} g</small></span><span class="g">${gtxt(x.g)}<small> g</small></span></li>`).join('')}</ul></div>`:'';
    R.innerHTML=head+`<p class="rule">Troca igualando <b>${grp.nut}</b> (${fmt(base,1)} g${key==='k'?' kcal':''}).</p><div class="card ref"><p class="t">Você pode comer</p><p class="n">${gtxt(gt)} g de ${tgt.label}${tgt.r?'<span class="tag">ref.</span>':''}</p>${mk(tgt,gt)}</div>`+othHtml+`<button type="button" class="copy" id="all" style="margin-top:14px">Ver todas as trocas</button>`;
    return}
  const cats=ORDER.filter(c=>alts.some(x=>catOf(x.f)===c));
  const bar=cats.length>1?`<div class="chips" role="group" aria-label="Filtrar por preparo">${['Todos',...cats].map(c=>`<button type="button" class="chip" data-c="${c}" aria-pressed="${c===filt}">${c}</button>`).join('')}</div>`:'';
  const list=alts.filter(x=>filt==='Todos'||catOf(x.f)===filt);
  const byBase=new Map();
  list.forEach(x=>{if(!byBase.has(x.f.b))byBase.set(x.f.b,[]);byBase.get(x.f.b).push(x)});
  const same=[...byBase.keys()].sort((a,b)=>(b===sel.b)-(a===sel.b));
  const cards=same.map(b=>{
    const rows=byBase.get(b).sort((a,c)=>ORDER.indexOf(catOf(a.f))-ORDER.indexOf(catOf(c.f)));
    return `<div class="card alt"><h3>${b}${b===sel.b?'<span class="tag">mesmo alimento</span>':''}${rows[0].f.r?'<span class="tag">ref.</span>':''}</h3><ul>${rows.map(x=>`<li><span class="fm">${x.f.f||'pronto'}<small>${fmt(x.f.k*x.g/100)} kcal · ${NUTL[key]} ${fmt(x.f[key]*x.g/100,1)} g</small></span><span class="g">${gtxt(x.g)}<small> g</small></span></li>`).join('')}</ul></div>`}).join('');
  R.innerHTML=head+`<p class="rule">Trocas dentro de <b>${grp.nome}</b>, igualando <b>${grp.nut}</b> (${fmt(base,1)} g${key==='k'?' kcal':''}).</p>
  <div class="tools"><span class="sr">Resultados</span>${bar?'':'<span></span>'}<button type="button" class="copy" id="copy">Copiar lista</button></div>${bar}${cards||'<div class="card empty">Nenhuma troca neste filtro.</div>'}`;
  window._txt=()=>`Trocas para ${gtxt(grams)} g de ${sel.label} (${grp.nut}):\n`+list.map(x=>`• ${x.f.b}${x.f.f?' '+x.f.f:''}: ${gtxt(x.g)} g`).join('\n')+'\n\nnutrivitorporto.com/lista-de-substituicoes';
}

$('#q').addEventListener('input',()=>{sel=null;$('#res').innerHTML='';suggest()});
$('#q2').addEventListener('input',()=>{tgt=null;suggest2();render()});
$('#q2').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(shown2[0]&&!$('#sug2').hidden)pick2(shown2[0])}else if(e.key==='Escape')$('#sug2').hidden=true});
$('#sug2').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick2(shown2[+b.dataset.i])});
$('#q').addEventListener('focus',()=>{if($('#q').value)$('#q').select()});
$('#q').addEventListener('keydown',e=>{
  const b=[...document.querySelectorAll('#sug button')];
  if(e.key==='ArrowDown'&&b.length){e.preventDefault();hi=(hi+1)%b.length}
  else if(e.key==='ArrowUp'&&b.length){e.preventDefault();hi=(hi-1+b.length)%b.length}
  else if(e.key==='Enter'){e.preventDefault();pick(shown[hi>=0?hi:0]||sel);return}
  else if(e.key==='Escape'){$('#sug').hidden=true;return}
  else return;
  b.forEach((x,i)=>x.setAttribute('aria-selected',i===hi))
});
$('#sug').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(shown[+b.dataset.i])});
document.addEventListener('click',e=>{if(!e.target.closest('.field')){$('#sug').hidden=true;$('#sug2').hidden=true}});
$('#gr').addEventListener('input',()=>{render();if(sel)history.replaceState(null,'','#'+sel.i+'-'+($('#gr').value||100))});
$('#res').addEventListener('click',async e=>{
  const c=e.target.closest('.chip');if(c){filt=c.dataset.c;render();return}
  if(e.target.id==='all'){tgt=null;$('#q2').value='';render();return}
  if(e.target.id==='copy'){const t=window._txt();try{if(navigator.share){await navigator.share({text:t})}else{await navigator.clipboard.writeText(t);e.target.textContent='Copiado ✓'}}catch(_){try{await navigator.clipboard.writeText(t);e.target.textContent='Copiado ✓'}catch(__){}}}
});
const h=location.hash.match(/^#(\d+)-(\d+(?:\.\d+)?)$/);
if(h&&foods[+h[1]]){$('#gr').value=h[2];pick(foods[+h[1]])}
</script>
