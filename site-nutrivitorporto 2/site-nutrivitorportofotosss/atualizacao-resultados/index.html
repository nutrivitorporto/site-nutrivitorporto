<style>
:root {
  --bg: #0b0b0b;
  --card: #151515;
  --line: #2a2a2a;
  --fg: #ffffff;
  --muted: #9a9a9a;
  --gold: #ffc907;
  --gold-deep: #d9a600;
  --ink: #111111;
  --cream: #f6efe2;
  --font: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; display: block; }
body {
  min-height: 100vh;
  background:
    radial-gradient(90% 40% at 50% 0%, rgba(255, 201, 7, .10), transparent 70%),
    var(--bg);
  color: var(--fg);
  font-family: var(--font);
  line-height: 1.4;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wrap {
  width: 100%; max-width: 520px; margin: 0 auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
main { flex: 1; padding-block: 40px 40px; }

/* Topo */
.profile { display: flex; flex-direction: column; align-items: center; text-align: center; }
.avatar {
  width: 150px; height: 150px; border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--gold);
  box-shadow: 0 0 0 7px rgba(255, 201, 7, .10), 0 18px 40px rgba(0, 0, 0, .6);
}
.handle { margin: 18px 0 0; font-size: 22px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
.tag { margin: 6px 0 0; display: inline-flex; align-items: center; gap: 8px; color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
.tag::before, .tag::after { content: ""; width: 18px; height: 1px; background: currentColor; opacity: .6; }

/* Banners */
.banners > li { min-width: 0; }
.banners { list-style: none; margin: 30px 0 0; padding: 0; display: grid; gap: 16px; }
.banner {
  position: relative; display: block; overflow: hidden;
  aspect-ratio: 16 / 10; max-width: 100%;
  border-radius: 14px;
  border: 1px solid var(--line);
  text-decoration: none; color: var(--fg);
  container-type: inline-size;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.banner:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0, 0, 0, .5); border-color: rgba(255, 201, 7, .5); }
.banner:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.copy {
  position: absolute; z-index: 2; inset: 0 auto 0 0;
  width: 60%;
  padding: 7cqw 0 7cqw 7cqw;
  display: flex; flex-direction: column; justify-content: center; gap: 2.2cqw;
}
.eyebrow { font-size: 3.1cqw; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
.headline { margin: 0; font-size: 8.4cqw; font-weight: 900; line-height: .98; text-transform: uppercase; letter-spacing: -.005em; }
.headline em { font-style: normal; color: var(--gold); }
.chip {
  align-self: flex-start;
  margin-top: 1.4cqw;
  padding: 1.6cqw 3.4cqw;
  border-radius: 999px;
  background: var(--gold); color: var(--ink);
  font-size: 3.2cqw; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  white-space: nowrap;
}
.photo { position: absolute; z-index: 1; inset: 0 0 0 auto; width: 56%; height: 100%; object-fit: cover; object-position: center top; }

/* Cards do time: artes prontas */
.banner-img { background: var(--card); }
.banner-img img { width: 100%; height: 100%; object-fit: cover; }

/* Ebooks */
.b-ebooks { background: linear-gradient(120deg, #141414 0%, #1d1a10 100%); }
.fan { position: absolute; z-index: 1; right: 4cqw; top: 50%; width: 44%; height: 80%; transform: translateY(-50%); }
.fan img {
  position: absolute; top: 50%; left: 50%;
  width: 52%; aspect-ratio: 2 / 3; height: auto; object-fit: cover;
  border-radius: 1.4cqw;
  box-shadow: 0 2cqw 5cqw rgba(0, 0, 0, .6);
}
.fan img:nth-child(1) { transform: translate(-100%, -48%) rotate(-10deg); }
.fan img:nth-child(2) { transform: translate(-50%, -54%); z-index: 2; }
.fan img:nth-child(3) { transform: translate(2%, -48%) rotate(10deg); }
.b-ebooks .sub { font-size: 3.4cqw; font-weight: 500; opacity: .85; }
.b-ebooks .sub b { color: var(--gold); font-weight: 800; }

/* Parcerias */
.b-parcerias { background: linear-gradient(100deg, #0f0f0f 0%, #1b1b1b 55%, #3a2d05 100%); }
.b-parcerias .photo { width: 50%; object-position: center 20%; -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 40%); mask-image: linear-gradient(90deg, transparent 0%, #000 40%); }
.b-parcerias .headline { font-weight: 300; letter-spacing: -.01em; }
.b-parcerias .headline em { font-weight: 900; }
.mail { font-size: 3.2cqw; font-weight: 600; opacity: .9; word-break: break-all; }


/* Resultados: faixa com rolagem automática */
.results h2 { margin: 6px 0 12px; text-align: center; font-size: 13px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.strip { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; border-radius: 14px; touch-action: pan-x pan-y; }
.strip::-webkit-scrollbar { display: none; }
.strip img { flex: none; width: 64%; max-width: 300px; height: auto; aspect-ratio: 720 / 836; background: #000; border-radius: 12px; border: 1px solid var(--line); }

footer { border-top: 1px solid var(--line); padding-block: 22px; text-align: center; color: var(--muted); font-size: 12px; }
footer p { margin: 0; }
@media (prefers-reduced-motion: reduce) { .banner { transition: none; } .banner:hover { transform: none; } }
</style>

<script>
(function(){
  var el=document.getElementById("strip"); if(!el) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var kids=[].slice.call(el.children);
  kids.forEach(function(k){var c=k.cloneNode(true);c.setAttribute("aria-hidden","true");c.alt="";c.loading="eager";el.appendChild(c);});
  var paused=false,timer=null,pos=0,last=0,SPEED=28;
  function half(){return el.scrollWidth/2;}
  function hold(){paused=true;clearTimeout(timer);}
  function release(){clearTimeout(timer);timer=setTimeout(function(){pos=el.scrollLeft;paused=false;},2500);}
  ["pointerdown","touchstart","wheel","mouseenter"].forEach(function(e){el.addEventListener(e,hold,{passive:true});});
  ["pointerup","touchend","mouseleave"].forEach(function(e){el.addEventListener(e,release,{passive:true});});
  el.addEventListener("scroll",function(){if(paused){if(el.scrollLeft>=half()){el.scrollLeft-=half();}else if(el.scrollLeft<=0){el.scrollLeft+=half();}}},{passive:true});
  function tick(t){
    if(!last)last=t; var dt=(t-last)/1000; last=t;
    if(!paused&&document.visibilityState==="visible"){pos+=SPEED*dt; if(pos>=half())pos-=half(); el.scrollLeft=pos;}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
