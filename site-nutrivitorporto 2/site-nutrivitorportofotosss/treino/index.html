<!doctype html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F3F5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0E10">

<title>Treino #teamporto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Layout: app de celular, uma coluna, navegação fixa embaixo.
   Cor: preto e amarelo da V Team, neutros frios. Tipo: Montserrat nos títulos e números, Figtree no texto. */
:root {
  --bg: #F2F3F5;
  --surface: #FFFFFF;
  --surface-2: #E9EBEF;
  --line: #D8DBE1;
  --fg: #14171C;
  --muted: #5B6471;
  --accent: #FED90A;
  --on-accent: #14171C;
  --accent-text: #7A5E00;
  --accent-soft: rgba(254, 217, 10, 0.30);
  --ok: #1B7F4B;
  --danger: #BF3328;
  --chart: #A67C00;
  --font-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0E10;
    --surface: #17191D;
    --surface-2: #20232A;
    --line: #2C3038;
    --fg: #F2F3F5;
    --muted: #9AA2AF;
    --accent: #FED90A;
    --on-accent: #14171C;
    --accent-text: #FED90A;
    --accent-soft: rgba(254, 217, 10, 0.16);
    --ok: #4CCB8A;
    --danger: #FF8074;
    --chart: #FED90A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0E10;
  --surface: #17191D;
  --surface-2: #20232A;
  --line: #2C3038;
  --fg: #F2F3F5;
  --muted: #9AA2AF;
  --accent: #FED90A;
  --on-accent: #14171C;
  --accent-text: #FED90A;
  --accent-soft: rgba(254, 217, 10, 0.16);
  --ok: #4CCB8A;
  --danger: #FF8074;
  --chart: #FED90A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px;
  min-height: 100vh;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: calc(env(safe-area-inset-top, 0px) + 8px);
  background: var(--bg); z-index: 30;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; }

/* topo */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 0 10px;
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; margin: 0; }
.brand::before { display: none !important; }
.brand::beforex { content: ""; width: 10px; height: 22px; background: var(--accent); transform: skewX(-14deg); display: inline-block; }
.pill { font-family: var(--font-display); font-weight: 700; font-size: 12px; background: var(--accent); color: var(--on-accent); padding: 5px 10px; border-radius: 99px; font-variant-numeric: tabular-nums; }

main { padding-top: 16px; display: grid; gap: 14px; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 18px; margin: 4px 0 0; letter-spacing: -0.01em; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 700; font-size: 14px; margin: 0; }
h4 { font-size: 15px; font-weight: 700; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap-r { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.btn {
  min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-family: var(--font-display); font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.5; }

/* lista de treinos */
.wk { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; }
.wk .letter { width: 52px; height: 52px; background: var(--accent); color: var(--on-accent); border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 24px; }
.wk .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.tag-today { font-family: var(--font-display); font-size: 11px; font-weight: 700; background: var(--accent-soft); color: var(--accent-text); padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.04em; }
.wk-actions { grid-column: 1 / -1; display: flex; gap: 8px; }

/* sessão */
.block-h { display: grid; gap: 2px; padding: 6px 2px 0; }
.block-h h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-text); }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.ex-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.chip { font-family: var(--font-display); font-weight: 700; font-size: 12px; background: var(--surface-2); padding: 4px 9px; border-radius: 99px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.last { font-size: 13px; color: var(--muted); }
.last b { color: var(--fg); font-weight: 600; }
details.how summary { font-size: 13px; color: var(--accent-text); cursor: pointer; width: fit-content; font-weight: 600; }
details.how p { font-size: 13px; color: var(--muted); padding-top: 6px; }
.sets { display: grid; gap: 6px; }
.sh, .set { display: grid; grid-template-columns: 28px 1fr 1fr 48px; gap: 8px; align-items: center; }
.sh span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.sh.cardio, .set.cardio { grid-template-columns: 1fr 1fr 48px; }
.set .n { font-family: var(--font-display); font-weight: 700; color: var(--muted); text-align: center; }
.inp {
  width: 100%; min-height: 46px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
  padding: 0 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; text-align: center; font-variant-numeric: tabular-nums;
}
.inp.sug { color: var(--muted); }
.inp.txt { text-align: left; font-family: var(--font-body); font-weight: 500; font-size: 15px; }
textarea.inp { padding: 10px; min-height: 84px; line-height: 1.4; }
.chk { width: 48px; height: 46px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.chk svg { width: 22px; height: 22px; }
.set.done .chk { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.set.done .inp { background: var(--accent-soft); border-color: transparent; color: var(--fg); }
.ex-foot { display: flex; gap: 8px; }

.warm { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.warm summary { font-weight: 600; cursor: pointer; }
.warm p { padding-top: 6px; color: var(--muted); }

.summary { border-color: var(--accent); background: var(--accent-soft); }
.summary ul { margin: 6px 0 0; padding-left: 18px; }

/* timer */
#timer {
  position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  max-width: 616px; margin: 0 auto;
  background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
}
#timer .t-label { font-size: 12px; opacity: 0.75; line-height: 1.2; }
#timer .t-time { font-family: var(--font-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
#timer .t-bar { height: 4px; background: rgba(128, 128, 128, 0.35); border-radius: 4px; overflow: hidden; margin-top: 4px; }
#timer .t-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
#timer button { background: rgba(128, 128, 128, 0.28); color: inherit; border: 0; border-radius: 8px; min-height: 40px; padding: 0 12px; font-weight: 700; }
#timer.done .t-time { color: var(--accent); }

/* nav */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.nav-in { max-width: 640px; margin: 0 auto; display: flex; align-items: stretch; gap: 2px; }
.nav-in > button { flex: 1 1 0; min-width: 0; }
.nav button { background: none; border: 0; min-height: 52px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--muted); border-radius: 8px; position: relative; }
.nav button svg { width: 22px; height: 22px; }
.nav button { opacity: .55; transition: color .15s, opacity .15s; }
.nav button[aria-current="page"] { color: var(--accent-text, var(--accent)); opacity: 1; }
.nav button[aria-current="page"] svg { filter: drop-shadow(0 0 5px var(--accent)); }
.legal { text-align: left; margin: 22px 2px 4px; font-size: 11px; line-height: 1.5; color: var(--muted); opacity: .55; display: grid; gap: 6px; }
.legal p { margin: 0; }
.legal details summary { cursor: pointer; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; list-style: none; }
.legal details summary::-webkit-details-marker { display: none; }
.legal details[open] summary { margin-bottom: 4px; }
.legal ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; }
.ch-empty { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 28px 18px; }
.ch-empty h4 { margin: 0; }
.ch-empty p { margin: 0; max-width: 300px; }
.ch-head { display: grid; gap: 4px; }
.ch-head h3 { margin: 0; font-size: 20px; }
.ch-head p { margin: 0; }
.ch-head .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text, var(--accent)); }
.ch-metas { margin: 2px 0 10px; padding-left: 20px; display: grid; gap: 4px; }
.ch-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.ch-stats div { background: var(--surface-2, var(--line)); border-radius: 10px; padding: 10px; display: grid; text-align: center; }
.ch-stats b { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--accent-text, var(--accent)); }
.ch-stats span { font-size: 11.5px; color: var(--muted); }
.ch-list { padding: 4px 12px; }
.ch-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 0; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; color: inherit; font: inherit; }
.ch-item:first-child { border-top: 0; }
.ch-item .grow { display: grid; font-weight: 600; }
.ch-item small { font-weight: 500; font-size: 12px; }
.ch-box { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; color: var(--on-accent); }
.ch-item.on .ch-box { background: var(--accent); border-color: var(--accent); }
.ch-pt { font-size: 12px; font-weight: 800; color: var(--muted); }
.ch-item.on .ch-pt { color: var(--accent-text, var(--accent)); }
.ch-item[disabled] { cursor: default; opacity: 1; }
.ch-code-row { display: flex; gap: 8px; }
.ch-code-row .inp { flex: 1; min-width: 0; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .2em; text-transform: uppercase; }
.ch-code-row .btn { flex: none; }
.podium { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: end; }
.pd { display: grid; gap: 4px; text-align: center; min-width: 0; }
.pd-names { display: grid; gap: 2px; font-weight: 700; font-size: 13.5px; line-height: 1.2; }
.pd-names span { overflow-wrap: anywhere; }
.pd-names .me { color: var(--accent-text, var(--accent)); }
.pd small { font-size: 11.5px; color: var(--muted); }
.pd-bar { border-radius: 10px 10px 4px 4px; display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; background: var(--surface); border: 1px solid var(--line); }
.pd.p1 .pd-bar { height: 112px; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pd.p2 .pd-bar { height: 84px; }
.pd.p3 .pd-bar { height: 64px; }
.rk-total { text-align: center; padding: 14px; }
.rk-total .v { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.1; color: var(--accent-text, var(--accent)); }
.rk-list { padding: 4px 14px; }
.rk-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.rk-row:first-child { border-top: 0; }
.rk-row.me .rk-nm b { color: var(--accent-text, var(--accent)); }
.rk-pos { width: 30px; flex: none; font-weight: 800; color: var(--muted); }
.rk-pos.gold { color: var(--accent-text, var(--accent)); }
.rk-av { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--line); }
.rk-nm { flex: 1; min-width: 0; display: grid; }
.rk-nm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk-nm small { font-weight: 500; }
.rk-n { display: grid; justify-items: end; line-height: 1.1; }
.rk-n b { font-size: 18px; font-family: var(--font-display); }
.rk-n small { font-size: 11px; color: var(--muted); }

/* evolução */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { min-height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: transparent; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.stat .v { font-family: var(--font-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .l { font-size: 12px; color: var(--muted); }
.stat .v.up { color: var(--ok); }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 12px; }
.chart .ln { fill: none; stroke: var(--chart); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent-soft); stroke: none; }
.chart .pt { fill: var(--surface); stroke: var(--chart); stroke-width: 2.5; }
.chart .pt.last { fill: var(--accent); stroke: var(--chart); }
.chart .val { fill: var(--fg); font-weight: 700; font-size: 13px; }
select.inp { text-align: left; font-family: var(--font-body); font-weight: 600; font-size: 15px; }

.hist-item { display: grid; gap: 8px; }
.hist-item summary { list-style: none; cursor: pointer; display: grid; gap: 2px; }
.hist-item summary::-webkit-details-marker { display: none; }
.kv { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.kv b { color: var(--fg); font-variant-numeric: tabular-nums; }
.ent { display: grid; grid-template-columns: 1fr; gap: 1px; padding: 6px 0; border-top: 1px solid var(--line); }
.ent .sets-line { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.field { display: grid; gap: 4px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.item-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.item-row:first-child { border-top: 0; }
.item-form { grid-column: 1 / -1; display: grid; gap: 10px; background: var(--surface-2); border-radius: 10px; padding: 12px; }
.icon-btn { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }
.confirm { background: var(--accent-soft); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
.warn { font-size: 13px; background: var(--surface-2); padding: 8px 12px; border-radius: 8px; color: var(--muted); }
.empty { text-align: center; padding: 28px 12px; display: grid; gap: 6px; justify-items: center; }
.empty svg { width: 36px; height: 36px; color: var(--muted); }
/* semana */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
.week .d { display: grid; justify-items: center; gap: 4px; font-size: 11px; color: var(--muted); font-weight: 600; }
.week .d i { width: 100%; max-width: 34px; height: 8px; border-radius: 99px; background: var(--surface-2); display: block; }
.week .d.on i { background: var(--accent); }
.week .d.today { color: var(--fg); }
.prog { font-size: 13px; color: var(--muted); }
.prog b { color: var(--fg); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; }
.tip { font-size: 12px; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); padding: 6px 10px; border-radius: 8px; }
/* avaliação */
.big { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 18px; font-weight: 700; }
.res-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.formula { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.formula:first-child { border-top: 0; }
.formula span:last-child { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.formula small { display: block; color: var(--muted); font-size: 12px; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.ok { background: rgba(27, 127, 75, 0.14); color: var(--ok); }
.badge.bad { background: rgba(191, 51, 40, 0.12); color: var(--danger); }
.cmp { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.cmp th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; text-align: right; padding: 6px 4px; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp td { padding: 8px 4px; border-top: 1px solid var(--line); text-align: right; }
.cmp td.up { color: var(--ok); font-weight: 700; }
.cmp td.dn { color: var(--danger); font-weight: 700; }
